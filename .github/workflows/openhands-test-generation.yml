
name: OpenHands Test Generation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    # Controlled path for testing an approved external repository (Saleor).
    # Inputs are validated against trusted configuration before checkout.
    inputs:
      target_repository:
        description: "owner/repo of the approved target repository"
        required: true
        type: string
      base_sha:
        description: "Full 40-character base commit SHA"
        required: true
        type: string
      head_sha:
        description: "Full 40-character PR head commit SHA"
        required: true
        type: string
      pr_number:
        description: "Target pull request number"
        required: true
        type: string
      pr_title:
        description: "Optional PR title"
        required: false
        type: string
      pr_body:
        description: "Optional PR description"
        required: false
        type: string

concurrency:
  group: openhands-test-generation
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  generate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout trusted base branch automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          path: trusted

      - name: Validate workflow inputs
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python trusted/.github/scripts/validate_target_repository.py \
            --automation-dir trusted

      - name: Checkout PR source without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || inputs.target_repository }}
          fetch-depth: 0
          persist-credentials: false
          path: pr-source

      - name: Checkout approved regression tests
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.REGRESSION_TESTS_REPOSITORY }}
          ref: main
          token: ${{ secrets.REGRESSION_TESTS_TOKEN }}
          path: regression-source
          persist-credentials: false


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare approved regression tests
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
        run: |
          mkdir -p trusted/regression-input
          python trusted/.github/scripts/prepare_regression_tests.py \
            --regression-repo regression-source \
            --source-repository "$TARGET_REPOSITORY" \
            --output trusted/regression-input/approved-regression-tests.tar.gz


      - name: Prepare PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" -C pr-source fetch "https://github.com/${TARGET_REPOSITORY}.git" "$BASE_SHA"
          git -C pr-source diff "$BASE_SHA" "$HEAD_SHA" > trusted/pr.diff
          echo "PR diff generated."
          wc -l trusted/pr.diff

      - name: Detect trusted automation drift
        id: automation_drift
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git -C pr-source diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            .github/scripts/generate_tests.py \
            .github/scripts/pr_test_harness.py \
            .github/scripts/sandbox_network.py \
            .github/scripts/package_proxy.py \
            .github/scripts/prepare_regression_tests.py \
            .github/scripts/publish_test_results.py \
            .github/scripts/safe_extract.py \
            .github/scripts/safe_extract_regression_tests.py \
            .github/workflows/openhands-test-generation.yml || true)
          if [ -n "$CHANGED" ]; then
            {
              echo "### Trusted automation drift"
              echo "This PR changes automation files. CI deliberately runs the base-branch copy for security, so these changes are not exercised here."
              echo "Validate them on the branch before merging."
              echo "$CHANGED" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PR modifies trusted automation; base-branch automation is used by this run."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenHands SDK
        run: |
          python -m pip install --upgrade pip
          pip install \
            openhands-sdk \
            openhands-tools \
            openhands-workspace \
            openhands-agent-server

          python -m pip show openhands-sdk openhands-tools openhands-workspace openhands-agent-server

      - name: Inspect OpenHands conversation API
        run: |
          python - <<'PYCODE'
          import inspect
          from importlib.metadata import version
          from openhands.sdk import Conversation

          packages = [
              "openhands-sdk",
              "openhands-tools",
              "openhands-workspace",
              "openhands-agent-server",
          ]

          for package in packages:
              print(f"{package}: {version(package)}")

          print("\\nConversation API:")
          for method_name in ["send_message", "run", "close"]:
              method = getattr(Conversation, method_name, None)
              if method is None:
                  print(f"{method_name}: NOT FOUND")
              else:
                  print(f"{method_name}: {inspect.signature(method)}")
          PYCODE

      - name: Configure isolated sandbox network
        env:
          PACKAGE_PROXY_ALLOWLIST: >-
            pypi.org,files.pythonhosted.org,registry.npmjs.org,registry.yarnpkg.com,
            deb.debian.org,security.debian.org,archive.ubuntu.com,security.ubuntu.com
          OH_SANDBOX_NETWORK: oh-pr-sandbox
          OH_SANDBOX_SUBNET: 172.28.0.0/16
          OH_SANDBOX_GATEWAY: 172.28.0.1
          PACKAGE_PROXY_PORT: '3128'
        run: |
          set -euo pipefail
          python trusted/.github/scripts/sandbox_network.py --configure
          nohup python trusted/.github/scripts/package_proxy.py \
            --host "$OH_SANDBOX_GATEWAY" \
            --port "$PACKAGE_PROXY_PORT" \
            --allowlist "$PACKAGE_PROXY_ALLOWLIST" \
            > package-proxy.log 2>&1 &
          echo $! > package-proxy.pid
          for _ in $(seq 1 20); do
            if curl -sf --max-time 3 \
              -x "http://${OH_SANDBOX_GATEWAY}:${PACKAGE_PROXY_PORT}" \
              https://pypi.org/simple/ >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! curl -sf --max-time 3 \
            -x "http://${OH_SANDBOX_GATEWAY}:${PACKAGE_PROXY_PORT}" \
            https://pypi.org/simple/ >/dev/null; then
            echo "Package proxy is unavailable; failing closed."
            exit 1
          fi

      - name: Verify sandbox network isolation
        env:
          CONTROL_PORT: '39991'
          HOST_PROBE_PORT: '39996'
        run: |
          set -euo pipefail
          docker rm -f oh-control-probe oh-target-probe >/dev/null 2>&1 || true
          docker run -d --rm --name oh-control-probe --network "$OH_SANDBOX_NETWORK" \
            -p "127.0.0.1:${CONTROL_PORT}:8000" \
            python:3.12-slim python -m http.server 8000 --bind 0.0.0.0 >/dev/null
          for _ in $(seq 1 20); do
            if curl -sf --max-time 2 "http://127.0.0.1:${CONTROL_PORT}/" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf --max-time 3 "http://127.0.0.1:${CONTROL_PORT}/" >/dev/null \
            || { echo "control-channel probe failed"; exit 1; }

          docker run -d --rm --name oh-target-probe --network "$OH_SANDBOX_NETWORK" \
            python:3.12-slim python -m http.server 8000 --bind 0.0.0.0 >/dev/null
          TARGET_IP=$(docker inspect -f \
            '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' oh-target-probe)

          if docker run --rm --network "$OH_SANDBOX_NETWORK" curlimages/curl \
            -sf --max-time 5 https://api.github.com >/dev/null 2>&1; then
            echo "public-internet probe failed"; exit 1
          fi
          if docker run --rm --network "$OH_SANDBOX_NETWORK" curlimages/curl \
            -sf --max-time 5 http://169.254.169.254/latest/meta-data/ >/dev/null 2>&1; then
            echo "metadata probe failed"; exit 1
          fi
          if docker run --rm --network "$OH_SANDBOX_NETWORK" python:3.12-slim \
            python -c 'import pathlib,sys; lines=[l for l in pathlib.Path("/proc/net/if_inet6").read_text().splitlines()[1:] if l.split()[1] != "01"]; print(lines); sys.exit(1 if lines else 0)'; then
            echo "IPv6 address probe failed"; exit 1
          fi
          if docker run --rm --network "$OH_SANDBOX_NETWORK" python:3.12-slim \
            python -c 'import socket,sys; s=socket.socket(socket.AF_INET6,socket.SOCK_STREAM); s.settimeout(2); code=s.connect_ex(("2001:4860:4860::8888",443)); sys.exit(0 if code == 0 else 1)'; then
            echo "IPv6 egress probe failed"; exit 1
          fi
          if docker run --rm --network "$OH_SANDBOX_NETWORK" curlimages/curl \
            -sf --max-time 5 "http://${TARGET_IP}:8000/" >/dev/null 2>&1; then
            echo "container-isolation probe failed"; exit 1
          fi

          python3 -m http.server "${HOST_PROBE_PORT}" --bind 0.0.0.0 >/dev/null 2>&1 &
          HOST_PID=$!
          sleep 1
          if docker run --rm --network "$OH_SANDBOX_NETWORK" curlimages/curl \
            -sf --max-time 5 "http://${OH_SANDBOX_GATEWAY}:${HOST_PROBE_PORT}/" \
            >/dev/null 2>&1; then
            echo "host-gateway probe failed"; kill "$HOST_PID"; exit 1
          fi
          kill "$HOST_PID"

          docker run --rm --network "$OH_SANDBOX_NETWORK" curlimages/curl \
            -sf --max-time 10 -x "http://${OH_SANDBOX_GATEWAY}:${PACKAGE_PROXY_PORT}" \
            https://pypi.org/simple/ >/dev/null \
            || { echo "package-proxy probe failed"; exit 1; }

          docker rm -f oh-control-probe oh-target-probe >/dev/null 2>&1 || true
          echo "Sandbox network isolation probes passed."

      - name: Generate and execute tests in OpenHands sandbox
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: gpt-6-luna
          LLM_BASE_URL: https://api.openai.com/v1

          PR_TITLE: ${{ github.event.pull_request.title || inputs.pr_title }}
          PR_BODY: ${{ github.event.pull_request.body || inputs.pr_body }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}

          AUTOMATION_DIR: ${{ github.workspace }}/trusted
          PR_SOURCE_DIR: ${{ github.workspace }}/pr-source
          PR_DIFF_FILE: ${{ github.workspace }}/trusted/pr.diff

        run: python trusted/.github/scripts/generate_tests.py

      - name: Upload generated tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openhands-generated-tests
          path: trusted/generated-tests/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup isolated sandbox network
        if: always()
        run: |
          python trusted/.github/scripts/sandbox_network.py --cleanup
          if [ -f package-proxy.pid ]; then
            kill "$(cat package-proxy.pid)" 2>/dev/null || true
            rm -f package-proxy.pid
          fi
          docker rm -f oh-control-probe oh-target-probe >/dev/null 2>&1 || true

  publish-results:
    # Runs only trusted, base-branch code. The GitHub write token never enters
    # the OpenHands sandbox or the generate-tests job.
    needs: generate-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout trusted base branch automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Validate workflow inputs
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          python trusted/.github/scripts/validate_target_repository.py \
            --automation-dir trusted

      - name: Download generated-test report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: openhands-generated-tests
          path: publisher-input

      - name: Ensure a report artifact exists
        run: |
          set -euo pipefail
          if [ ! -f publisher-input/openhands-report.json ]; then
            mkdir -p publisher-input
            printf '%s\n' \
              '{"result":"not run","limitations":["No report artifact was produced."],"failures":[]}' \
              > publisher-input/openhands-report.json
          fi

      # The diff is regenerated from trusted event metadata, never read from
      # the agent-produced artifact, so an agent cannot relocate an inline
      # comment to a line it did not actually change.
      - name: Regenerate trusted PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            -C trusted fetch --no-tags "https://github.com/${TARGET_REPOSITORY}.git" \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          ACTUAL_HEAD=$(git -C trusted rev-parse refs/remotes/pr/head)
          if [ "$ACTUAL_HEAD" != "$HEAD_SHA" ]; then
            echo "PR head SHA does not match workflow event; failing closed."
            exit 1
          fi
          git -C trusted diff "$BASE_SHA" refs/remotes/pr/head > trusted/pr.diff
          echo "Trusted PR diff regenerated."
          wc -l trusted/pr.diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish validated results to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RESULT: ${{ needs.generate-tests.result }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
        run: |
          python trusted/.github/scripts/publish_test_results.py \
            --publish \
            --report publisher-input/openhands-report.json \
            --diff trusted/pr.diff \
            --workflow-result "$WORKFLOW_RESULT" \
            --repository "$TARGET_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"
